version: '3.8'

services:
  veritas-appliance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas_rag_appliance
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./veritas_index:/app/veritas_index
      - ./audit_logs:/app/audit_logs
      - ./raw_papers:/app/raw_papers
    restart: unless-stopped
